<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>HAC Beograd - OBS YouTube prenos</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#17191e;color:#dbe1e8;font:13px Segoe UI,Arial,sans-serif}
body{display:flex;flex-direction:column}main{flex:1;min-height:120px;position:relative;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{height:34px;flex:none;background:#22262d;border-top:1px solid #343944;display:flex;align-items:center;gap:8px;padding:0 8px}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9bcde5}
button,a{border:1px solid #46505e;border-radius:4px;color:#dbe1e8;background:#343a46;padding:4px 7px;font:12px Segoe UI,Arial,sans-serif;cursor:pointer;text-decoration:none}
#settings{display:none;position:absolute;z-index:2;bottom:0;left:0;right:0;padding:12px;background:#252b35;border-top:1px solid #596373}
#settings.open{display:block}
input{display:block;width:100%;padding:8px;margin:8px 0;color:#fff;background:#11151b;border:1px solid #687584}
.controls{display:flex;flex-wrap:wrap;gap:6px}
small{display:block;color:#b4bfcd;line-height:1.4;margin-top:9px}
#error{color:#ffb5a9}
</style>
</head>
<body>
<main>
<iframe id="player" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="HAC Beograd YouTube"></iframe>
<div id="settings">
<label for="url">Direktan link zakazanog YouTube prenosa</label>
<input id="url" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false">
<div class="controls"><button id="load">Ucitaj</button><button id="channel">Aktivni prenos kanala</button><button id="close">Zatvori</button></div>
<div id="error"></div>
<small>Za prikaz zakazanog videa pre pocetka unesi direktan YouTube link. Bez njega plejer trazi trenutni live na kanalu. Zvuk se pokrece iskljucen.</small>
</div>
</main>
<footer><span id="title">HAC Beograd · prenos uzivo</span><a id="youtube" href="https://www.youtube.com/channel/UCQXPKDYp4U9JkTWAON_AhOw/live" target="_blank" rel="noopener noreferrer">YouTube</a><button id="gear">⚙</button></footer>
<script>
(() => {
const channel='UCx0M0Dh7wbR0ajYfI61BNKw', key='hac_obs_video_id_2026_v1', $=id=>document.getElementById(id);
const good=id=>/^[a-zA-Z0-9_-]{11}$/.test(id||'');
let id='';try{id=localStorage.getItem(key)||''}catch(e){}
function extract(s){
 s=s.trim();if(good(s))return s;
 try{const u=new URL(s), h=u.hostname.toLowerCase();let v='';
 if(h==='youtu.be'||h==='www.youtu.be')v=u.pathname.split('/')[1]||'';
 else if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(h)){
 if(u.pathname==='/watch')v=u.searchParams.get('v')||'';
 else if(/^\/(live|embed|shorts)\//.test(u.pathname))v=u.pathname.split('/')[2]||'';}
 return good(v)?v:null;}catch(e){return null;}
}
function play(){
 const common='autoplay=1&mute=1&controls=1&playsinline=1&rel=0&origin='+encodeURIComponent(location.origin);
 $('player').src=good(id)?'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?'+common:'https://www.youtube.com/embed/live_stream?channel='+channel+'&'+common;
 $('title').textContent=id?'HAC Beograd · zakazani video':'HAC Beograd · prenos uzivo';
 $('youtube').href=id?'https://www.youtube.com/watch?v='+encodeURIComponent(id):'https://www.youtube.com/channel/'+channel+'/live';
}
function save(){try{if(id)localStorage.setItem(key,id);else localStorage.removeItem(key)}catch(e){}}
$('gear').onclick=()=>{$('url').value=id?'https://www.youtube.com/watch?v='+id:'';$('error').textContent='';$('settings').classList.toggle('open')};
$('close').onclick=()=>{$('settings').classList.remove('open')};
$('load').onclick=()=>{let found=extract($('url').value);if(!found){$('error').textContent='Neispravan YouTube link.';return;}id=found;save();play();$('settings').classList.remove('open')};
$('url').onkeydown=e=>{if(e.key==='Enter')$('load').click()};
$('channel').onclick=()=>{id='';save();play();$('settings').classList.remove('open')};
play();
})();
</script></body></html>
