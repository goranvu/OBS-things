name: Napravi OBS DLL na GitHub-u

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-dll:
    name: Windows OBS plugin
    runs-on: windows-2022
    steps:
      - name: Preuzmi moje fajlove
        uses: actions/checkout@v4

      - name: Preuzmi zvanicni OBS plugin sablon
        shell: pwsh
        run: git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git template

      - name: Postavi moj izvorni kod
        shell: pwsh
        run: |
          Copy-Item CMakeLists.txt template/CMakeLists.txt -Force
          Copy-Item buildspec.json template/buildspec.json -Force
          Copy-Item src/* template/src/ -Force
          Remove-Item template/src/plugin-main.c -ErrorAction SilentlyContinue
          Copy-Item data/locale/en-US.ini template/data/locale/en-US.ini -Force

      - name: Pripremi kompilaciju
        shell: pwsh
        working-directory: template
        run: cmake --preset windows-x64 -DENABLE_QT=ON -DENABLE_FRONTEND_API=ON

      - name: Kompajliraj DLL
        shell: pwsh
        working-directory: template
        run: cmake --build --preset windows-x64 --config RelWithDebInfo

      - name: Proveri parser, status bar i HTTPS
        shell: pwsh
        run: |
          $qt = Get-ChildItem template/.deps -Recurse -Filter Qt6Core.dll -File | Select-Object -First 1
          if (!$qt) { throw 'Qt6Core.dll nije pronadjen za testove' }
          $env:PATH = "$($qt.Directory.FullName);$env:PATH"
          $platform = Get-ChildItem template/.deps -Recurse -Filter qwindows.dll -File | Select-Object -First 1
          if (!$platform) { throw 'Qt windows platform plugin nije pronadjen' }
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = $platform.Directory.FullName
          $env:QT_QPA_PLATFORM = 'windows'
          $test = Get-ChildItem template/build_x64 -Recurse -Filter counter-tests.exe -File | Select-Object -First 1
          if (!$test) { throw 'counter-tests.exe nije pronadjen' }
          $env:COUNTER_HTTPS_SMOKE_URL = 'https://example.com/'
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Testovi nisu prosli' }

      - name: Pripremi paket
        shell: pwsh
        run: |
          $dll = Get-ChildItem template/build_x64 -Recurse -Filter obs-fixed-counter.dll -File | Select-Object -First 1
          if (!$dll) { throw 'Kompilacija nije proizvela obs-fixed-counter.dll' }
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" -File | Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin nije pronadjen' }
          $imports = (& $dumpbin.FullName /dependents $dll.FullName | Out-String)
          Write-Output $imports
          if ($imports -match 'Qt6Network.dll|libssl|libcrypto') { throw 'DLL jos zavisi od dodatnog TLS runtime-a' }
          if ($imports -notmatch 'WINHTTP.dll') { throw 'DLL ne koristi Windows HTTPS' }
          New-Item -ItemType Directory -Force paket/obs-fixed-counter/bin/64bit | Out-Null
          New-Item -ItemType Directory -Force paket/obs-fixed-counter/data/locale | Out-Null
          Copy-Item $dll.FullName paket/obs-fixed-counter/bin/64bit/obs-fixed-counter.dll
          Copy-Item data/locale/en-US.ini paket/obs-fixed-counter/data/locale/en-US.ini
          Copy-Item UPUTSTVO_GITHUB.txt paket/obs-fixed-counter/UPUTSTVO.txt

      - name: Sacuvaj paket za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Broj-gledalaca-Windows
          path: paket/obs-fixed-counter/
          if-no-files-found: error
