name: Build OBS Edit Panel (Windows x64)
on:
  push:
    paths:
      - "obs-edit-panel/**"
      - ".github/workflows/build-obs-edit-panel.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Get official OBS plugin build support
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git "$env:RUNNER_TEMP/obs-template"
          New-Item -ItemType Directory -Force -Path "obs-edit-panel/cmake/common" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/obs-template/cmake/common/*" "obs-edit-panel/cmake/common/" -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP/obs-template/cmake/Find*.cmake" "obs-edit-panel/cmake/" -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP/obs-template/cmake/*.cmake" "obs-edit-panel/cmake/" -Force -ErrorAction SilentlyContinue
      - name: Configure
        run: cmake -S obs-edit-panel -B obs-edit-panel/build -G "Visual Studio 17 2022" -A x64
      - name: Compile
        run: cmake --build obs-edit-panel/build --config RelWithDebInfo --parallel
      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "obs-edit-panel/build" -Recurse -Filter "obs-edit-panel.dll" | Select-Object -First 1
          if (-not $dll) { throw "DLL was not produced" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $dll.FullName "dist/obs-edit-panel.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: obs-edit-panel-obs33-win64
          path: dist/obs-edit-panel.dll
