name: Build OBS Edit Panel (Windows x64)
on:
  push:
    paths:
      - "obs-edit-panel/**"
      - ".github/workflows/build-obs-edit-panel.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Clone OBS template and overlay plugin
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git build-project
          $preset = Get-Content "build-project/CMakePresets.json" -Raw
          $preset = $preset.Replace("Visual Studio 17 2022", "Visual Studio 18 2026")
          $preset = $preset.Replace("x64,version=10.0.22621", "x64")
          Set-Content "build-project/CMakePresets.json" $preset
          Copy-Item "obs-edit-panel/CMakeLists.txt" "build-project/CMakeLists.txt" -Force
          Copy-Item "obs-edit-panel/buildspec.json" "build-project/buildspec.json" -Force
          Copy-Item "obs-edit-panel/src/plugin.cpp" "build-project/src/plugin.cpp" -Force
          New-Item -ItemType Directory -Force -Path "build-project/.deps" | Out-Null
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/archive/refs/tags/33.0.1.zip" -OutFile "build-project/.deps/33.0.1.zip"
          $obsHash = (Get-FileHash "build-project/.deps/33.0.1.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec = Get-Content "build-project/buildspec.json" -Raw | ConvertFrom-Json
          $spec.dependencies.'obs-studio'.hashes = @{ "windows-x64" = $obsHash }
          $spec | ConvertTo-Json -Depth 10 | Set-Content "build-project/buildspec.json"
      - name: Build plugin
        shell: pwsh
        working-directory: build-project
        env:
          CI: "true"
        run: |
          & "$PWD/.github/scripts/Build-Windows.ps1" -Target x64 -Configuration RelWithDebInfo
      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "build-project/release" -Recurse -Filter "obs-edit-panel.dll" | Select-Object -First 1
          if (-not $dll) { throw "obs-edit-panel.dll was not produced" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $dll.FullName "dist/obs-edit-panel.dll" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: obs-edit-panel-obs33-win64
          path: dist/obs-edit-panel.dll
